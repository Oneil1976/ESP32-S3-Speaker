# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

esphome:
  name: esp32-s3-speaker
  friendly_name: ESP32-S3-Speaker
psram:
  mode: octal
  speed: 80MHZ
  
esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  level: WARN

api:
  encryption:
    key: "xxx"

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ESP32-S3-Speake Fallback Hotspot
    password: "xxx"

captive_portal:
light:
  - platform: esp32_rmt_led_strip
    pin: GPIO48
    num_leds: 1
    chipset: WS2812
    name: "Onboard RGB LED"
    channel_colors: RGB

i2s_audio:
  - id: i2s_audio_1
    i2s_lrclk_pin: GPIO15
    i2s_bclk_pin: GPIO17

speaker:
  - platform: i2s_audio
    id: speaker_i2s_audio_1
    dac_type: external
    i2s_audio_id: i2s_audio_1
    i2s_dout_pin: GPIO16
    buffer_duration: 100ms
    
  - platform: mixer
    id: speaker_mixer_1
    output_speaker: speaker_i2s_audio_1
    source_speakers:
      - id: source_speakers_1
      - id: source_speakers_2
    task_stack_in_psram: true
    
media_player:
  - platform: speaker
    name: ESP32-Speaker Audio Media Player
    id: media_player_speaker_1
    announcement_pipeline:
      id: media_player_speaker_1_announcement_pipeline
      speaker: source_speakers_1
    media_pipeline:
      id: media_player_speaker_1_media_pipeline
      speaker: source_speakers_2
    task_stack_in_psram: true
    buffer_size: 500000
    icon: "mdi:speaker"
